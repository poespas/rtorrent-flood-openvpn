name: release

on:
  schedule:
    # Monthly on the 1st at 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest flood version
        id: flood
        run: |
          version="$(curl -fsSL https://api.github.com/repos/jesec/flood/releases/latest \
            | jq -r .tag_name | sed 's/^v//')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="v$(date +%Y.%m)"
          tag="${base}"
          bump=1
          while gh release view "${tag}" >/dev/null 2>&1; do
            tag="${base}.${bump}"
            bump=$((bump + 1))
          done
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${tag}"

      - name: Compute image name
        id: img
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          build-args: FLOOD_VERSION=${{ steps.flood.outputs.version }}
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          {
            echo "Automated monthly release."
            echo ""
            echo "- Image: \`${{ steps.img.outputs.image }}\`"
            echo "- Tags: \`latest\`, \`${tag}\`"
            echo "- Flood version: \`v${{ steps.flood.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } > /tmp/release-notes.md
          git tag "${tag}"
          git push origin "${tag}"
          gh release create "${tag}" \
            --title "Monthly release ${tag}" \
            --notes-file /tmp/release-notes.md
