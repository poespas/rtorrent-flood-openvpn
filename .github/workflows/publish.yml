name: publish

on:
  schedule:
    # Monthly on the 1st at 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest flood version
        id: flood
        run: |
          # strip the leading "v" from the flood release tag, e.g. v4.16.1 -> 4.16.1
          version="$(curl -fsSL https://api.github.com/repos/jesec/flood/releases/latest \
            | jq -r .tag_name | sed 's/^v//')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compute image name
        id: img
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          build-args: FLOOD_VERSION=${{ steps.flood.outputs.version }}
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ steps.flood.outputs.version }}
