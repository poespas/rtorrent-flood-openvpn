#############################################################
# rtorrent-flood-openvpn - OpenVPN client configuration
#############################################################
#
# Drop your provider's config here (or edit this file) and restart the
# container. At least one reachable `remote <host|ip> <port>` is required.
#
# The container enforces a kill-switch: while this tunnel is down, the
# container has NO outbound connectivity at all. All traffic (DNS included)
# is forced through the tunnel.
#
# Notes for provider .ovpn files:
#   - If your file references an external certificate/key, paste the
#     contents inline inside the <ca>/<cert>/<key>/<tls-auth> blocks below
#     and delete the `ca foo.crt` style lines.
#   - deprecated/removed directives are stripped automatically at boot
#     (keysize, ns-cert-type, comp-lzo, fragment, block-outside-dns, ...).

client
dev tun
proto udp

# ---- EDIT ME: your VPN server -------------------------------------------
# remote your.vpn-provider.example 1194

resolv-retry infinite
nobind
persist-key
persist-tun
persist-remote-ip

auth-user-pass /config/vpn/vpn.auth

verb 3

# -------- optional: paste inline credentials/certs as needed -------------
# <ca>
# -----BEGIN CERTIFICATE-----
# ...
# -----END CERTIFICATE-----
# </ca>

# <cert>
# </cert>

# <key>
# </key>

# <tls-auth>
# </tls-auth>
